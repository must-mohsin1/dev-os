# dev-os :: researcher  (partial config; Hermes deep-merges over defaults)
# grok-4.3 is the xai-oauth top model id (grok-4.20-reasoning is not a valid id and 404s).
# NOTE: xai-oauth inference needs xAI API credits / a raised spending limit at console.x.ai —
# a SuperGrok chat subscription alone returns 403 "out of credits"; until then the
# fallback_providers below carry research on OpenRouter.
model:
  provider: xai-oauth
  default: grok-4.3
  api_mode: chat_completions
toolsets:
  - hermes-cli
agent:
  # Valid values: xhigh/high/medium/low/minimal/none — a model id here is silently
  # ignored (grok-4.3 is the x_search model, set under x_search: below).
  reasoning_effort: medium
  # 60 turns: research briefs complete well inside this (Item10 research ran under it).
  # Wall-clock caps for dispatched workers are per-task max_runtime_seconds (item 10 scope) — agent.gateway_timeout only governs gateway chat-session inactivity, NOT kanban workers, so it is deliberately not set here.
  max_turns: 60
x_search:
  model: grok-4.3
fallback_providers:
  - { provider: openrouter, model: deepseek/deepseek-v4-flash, base_url: https://openrouter.ai/api/v1, api_mode: chat_completions }
  - { provider: openrouter, model: deepseek/deepseek-v4-pro, base_url: https://openrouter.ai/api/v1, api_mode: chat_completions }
  - { provider: openrouter, model: openai/gpt-5.5, base_url: https://openrouter.ai/api/v1, api_mode: chat_completions }
