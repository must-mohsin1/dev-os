# dev-os :: researcher  (partial config; Hermes deep-merges over defaults)
model:
  provider: xai-oauth
  default: grok-4.20-reasoning
  api_mode: chat_completions
toolsets:
  - hermes-cli
agent:
  reasoning_effort: grok-4.20-reasoning
  max_turns: 90
x_search:
  model: grok-4.20-reasoning
fallback_providers:
  - { provider: openrouter, model: openai/gpt-5.5, base_url: https://openrouter.ai/api/v1, api_mode: chat_completions }
  - { provider: openrouter, model: deepseek/deepseek-v4-pro, base_url: https://openrouter.ai/api/v1, api_mode: chat_completions }
